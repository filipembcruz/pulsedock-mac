name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # unpack commit + Release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # One-time: the first upload arrives as a single archive (bootstrap/). Unpack it into the repo.
      - name: Unpack bootstrap archive
        if: hashFiles('bootstrap/source.tar.gz.b64') != ''
        run: |
          python3 -c "import base64;open('/tmp/src.tgz','wb').write(base64.b64decode(open('bootstrap/source.tar.gz.b64').read()))"
          tar -xzf /tmp/src.tgz -C .
          git rm -rq bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack source archive"
          git push

      - name: Toolchain
        if: hashFiles('Package.swift') != ''
        run: |
          xcodebuild -version
          swift --version

      - name: Build PulseDock.app
        if: hashFiles('Package.swift') != ''
        run: |
          chmod +x scripts/*.sh
          VERSION=1.0.${{ github.run_number }} BUILD=${{ github.run_number }} ./scripts/build-app.sh

      - uses: actions/upload-artifact@v4
        if: hashFiles('Package.swift') != ''
        with:
          name: PulseDock-macOS
          path: |
            dist/PulseDock.dmg
            dist/PulseDock.zip

      - name: Release
        if: hashFiles('Package.swift') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PulseDock for macOS v1.0.${{ github.run_number }}
          body: |
            **Download `PulseDock.dmg`**, open it and drag PulseDock to Applications.
            macOS 14 Sonoma or later · Apple silicon and Intel (universal) · Liquid Glass on macOS 26+.

            First launch: the app is not notarized, so right-click PulseDock → **Open** → **Open**
            (or run `xattr -dr com.apple.quarantine /Applications/PulseDock.app`).
          files: |
            dist/PulseDock.dmg
            dist/PulseDock.zip
          make_latest: true
