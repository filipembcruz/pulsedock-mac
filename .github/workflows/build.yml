name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # unpack commit + Release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Source arrives as one archive uploaded through the GitHub web UI. Unpack it into the repo and commit.
      - name: Unpack uploaded source archive
        if: hashFiles('pulsedock-source.tgz') != ''
        run: |
          tar -xzf pulsedock-source.tgz -C .
          git rm -q pulsedock-source.tgz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack source archive" || echo "nothing to commit"
          git push

      - name: Toolchain
        if: hashFiles('Package.swift') != ''
        run: |
          xcodebuild -version
          swift --version

      - name: Build PulseDock.app
        if: hashFiles('Package.swift') != ''
        run: |
          chmod +x scripts/*.sh
          VERSION=1.0.${{ github.run_number }} BUILD=${{ github.run_number }} ./scripts/build-app.sh

      - uses: actions/upload-artifact@v4
        if: hashFiles('Package.swift') != ''
        with:
          name: PulseDock-macOS
          path: |
            dist/PulseDock.dmg
            dist/PulseDock.zip

      - name: Release
        if: hashFiles('Package.swift') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PulseDock for macOS v1.0.${{ github.run_number }}
          body: |
            **Download `PulseDock.dmg`**, open it and drag PulseDock to Applications.
            macOS 14 Sonoma or later · Apple silicon and Intel (universal) · Liquid Glass on macOS 26+.

            First launch: the app is not notarized, so macOS blocks it once. Click **Done**, then
            System Settings → Privacy & Security → **Open Anyway** next to "PulseDock".
          files: |
            dist/PulseDock.dmg
            dist/PulseDock.zip
          make_latest: true
